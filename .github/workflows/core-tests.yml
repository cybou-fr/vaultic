name: Go core tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core unit tests (Go 1.23)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Run core tests with race detector
        run: go test -race ./internal/...
      - name: Vet core packages
        run: go vet ./internal/...
