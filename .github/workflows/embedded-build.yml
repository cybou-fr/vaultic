name: Embedded restic engine (build)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
      - name: Install Fyne native dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev
      - name: Build integrated Vaultic binary
        run: python3 scripts/assemble.py
      - name: Assert no external restic command is required
        run: |
          test -x dist/vaultic
          ./dist/vaultic version
      - uses: actions/upload-artifact@v4
        with:
          name: vaultic-linux-development
          path: |
            dist/vaultic
            dist/LICENSE
            dist/NOTICE
            dist/THIRD_PARTY_NOTICES.md

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
      - name: Build integrated Vaultic binary
        run: py scripts/assemble.py
      - name: Check built executable
        shell: pwsh
        run: |
          if (!(Test-Path dist/vaultic.exe)) { throw "Missing Vaultic executable" }
      - uses: actions/upload-artifact@v4
        with:
          name: vaultic-windows-development
          path: |
            dist/vaultic.exe
            dist/LICENSE
            dist/NOTICE
            dist/THIRD_PARTY_NOTICES.md
